---
- name: Configurar servidores web
  hosts: webservers
  become: true

  tasks:
    - name: Instalar Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Habilitar e iniciar Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Criar página de demonstração
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Servidor: {{ inventory_hostname }}</h1>
          <p>Configurado automaticamente pelo Ansible.</p>
        mode: "0644"
