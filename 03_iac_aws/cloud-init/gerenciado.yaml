#cloud-config
packages:
  - puppet-agent

write_files:
  - path: /etc/hosts
    append: true
    content: |
      ${server_ip} ${server_name}
  - path: /etc/puppet/puppet.conf
    defer: true
    content: |
      [main]
      server = ${server_name}
      certname = ${certname}

      [agent]
      runinterval = 7s

runcmd:
  - [puppet, config, set, ca_server, "${puppet_server_name}", --section, server]
  - [sudo, puppet, ssl, bootstrap, --waitforcert, 0]
  - [systemctl, enable, --now, puppet.service]
