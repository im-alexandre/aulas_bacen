---
- name: Aplicar a configuração padrão aos três gerenciados
  hosts: gerenciados
  become: true
  gather_facts: false

  tasks:
    - name: Manter o arquivo de configuração
      ansible.builtin.copy:
        dest: /etc/bacen-ansible.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          mensagem=Configuração padrão BACEN
