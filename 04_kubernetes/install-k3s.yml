---
- name: Preparar os nós Kubernetes
  hosts: k3s
  become: true

  tasks:
    - name: Instalar dependências
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: Baixar instalador oficial do K3s
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

- name: Instalar o Control Plane
  hosts: k3s_server
  become: true

  tasks:
    - name: Instalar K3s Server
      ansible.builtin.command:
        cmd: sh /tmp/install-k3s.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_EXEC: >-
          server --tls-san {{ ansible_host }}

    - name: Aguardar API Kubernetes
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 6443
        timeout: 180

    - name: Ler token do cluster
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      no_log: true

    - name: Baixar kubeconfig para o host
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./k3s.yaml
        flat: true

- name: Adicionar Worker ao cluster
  hosts: k3s_agents
  become: true

  tasks:
    - name: Aguardar API do Control Plane
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"
        port: 6443
        timeout: 180

    - name: Instalar K3s Agent
      ansible.builtin.command:
        cmd: sh /tmp/install-k3s.sh
        creates: /usr/local/bin/k3s
      environment:
        K3S_URL: >-
          https://{{ hostvars[groups['k3s_server'][0]].ansible_host }}:6443
        K3S_TOKEN: >-
          {{ hostvars[groups['k3s_server'][0]].k3s_token.content | b64decode | trim }}
      no_log: true

- name: Configurar kubectl no Ubuntu Desktop
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Configurar IP do Control Plane
      ansible.builtin.replace:
        path: ./k3s.yaml
        regexp: 'https://127\.0\.0\.1:6443'
        replace: >-
          https://{{ hostvars[groups['k3s_server'][0]].ansible_host }}:6443

    - name: Proteger kubeconfig
      ansible.builtin.file:
        path: ./k3s.yaml
        mode: "0600"
